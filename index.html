<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='black'/><text x='8' y='12.5' font-size='12' font-family='monospace' text-anchor='middle' fill='%23ff3d9a'>#</text></svg>" />
    <title>North Star</title>
    <script>
      // Apply a stored light theme before the first paint (D-069); src/state/theme.ts takes over from here.
      try {
        var t = localStorage.getItem('north-star.theme')
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (t === 'light') document.documentElement.dataset.theme = 'light'
        // The interface's size (D-417), so nothing jumps; src/state/display.ts takes over (and reads D-348's old hud size).
        var s = Number(localStorage.getItem('north-star.ui-size'))
        if (s >= 75 && s <= 150 && s !== 100) document.documentElement.style.setProperty('--ui-page', String(s / 100))
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
