<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>The agent's place · options</title>
<link rel="stylesheet" href="../../../src/styles/tokens.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/inter/opsz.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/jetbrains-mono/index.css">
<style>
/* A preview only (Q-036's leftover after D-412): where the agent's chat lives in the shell. Hand-made copies of the
   app's parts on its tokens; served from the repo root so the token and font files load. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-display); font-size: 14px; }
button { font: inherit; color: inherit; }

.top { position: fixed; inset: 0 0 auto 0; min-height: 48px; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; }
.top h1 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); }
.grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.grp > span { color: var(--fg-dim); margin-right: 6px; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
.opt { background: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 11px; color: var(--fg-dim); cursor: pointer; }
.opt b { color: var(--accent-magenta); font-weight: 400; margin-right: 6px; }
.opt:hover { color: var(--fg); background: var(--wash-2); }
.opt[aria-pressed='true'] { color: var(--fg); border-color: var(--line-hover); background: var(--wash-2); }
.rec { color: var(--accent-cyan); margin-left: 4px; }

.about { position: fixed; top: 96px; left: 0; width: 340px; bottom: 0; overflow: auto; padding: 18px 20px 40px; border-right: 1px solid var(--line); color: var(--fg-muted); font-size: 13px; line-height: 1.55; }
.about h2 { margin: 18px 0 6px; font: 500 11px/1.3 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--fg-dim); }
.about h2:first-child { margin-top: 0; }
.about h3 { margin: 0 0 8px; font-size: 18px; font-weight: 500; color: var(--fg-strong); }
.about b { color: var(--fg); font-weight: 500; }
.about .plus b { color: var(--accent-cyan); }
.about .minus b { color: var(--accent-magenta); }
.about ul { padding-left: 18px; margin: 0; }
.about li { margin-bottom: 6px; }
.about .now { margin-top: 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--fg-dim); }
.about .now b { color: var(--accent-cyan); }

/* The screen: the app at 1280 × 760, scaled to fit. */
.stageWrap { position: fixed; top: 96px; left: 340px; right: 0; bottom: 0; display: grid; place-items: center; overflow: hidden; }
.stage { width: 1280px; height: 760px; position: relative; overflow: hidden; background: var(--ground); transform-origin: center; border-radius: 6px; outline: 1px solid var(--line); }
.stage * { transition: left .5s cubic-bezier(.2,.8,.2,1), right .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1), opacity .3s; }

/* The main sheet. */
.sheet { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: var(--bg); overflow: hidden; }
.page { position: absolute; inset: 52px 0 0 0; border-top: 1px solid var(--line); }
.sheet[data-lifted] { top: 8px; bottom: 8px; border-radius: 24px; outline: 1px solid var(--line); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(var(--fg-faint) 1px, transparent 1.3px); background-size: 25px 25px; opacity: .28; }
.crumb { position: absolute; left: 24px; top: 16px; font-size: 13px; color: var(--fg-dim); white-space: nowrap; }
.crumb i { color: var(--accent-magenta); font-style: normal; }
.crumb b { color: var(--fg); font-weight: 400; }

/* The HUD's tools on the left edge, on the rail. */
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 60px; z-index: 6; pointer-events: none; }
.rail .mid { position: absolute; top: 300px; left: 18px; display: flex; flex-direction: column; gap: 14px; color: var(--fg-dim); font: 18px/1 var(--font-mono); }
.rail .mid span:first-child { color: var(--accent-magenta); }
.rail .foot { position: absolute; bottom: 18px; left: 15px; display: flex; flex-direction: column; gap: 14px; align-items: center; color: var(--fg-dim); font: 13px/1 var(--font-mono); }
.rail .foot .ic { width: 30px; height: 26px; display: grid; place-items: center; border-radius: 8px; }
.rail .foot .ic[data-on] { color: var(--accent-cyan); }
.rail .foot .ic.ai { color: var(--fg); }
.rail .foot .ic.ai[data-on] { color: var(--accent-cyan); }
.rail .foot .me { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-magenta); color: var(--bg); display: grid; place-items: center; font-weight: 600; }

/* Pieces. */
.piece { position: absolute; background: var(--piece); border-top: 2px solid var(--fg-dim); box-shadow: 0 0 0 1px var(--piece-edge); }
.pname { position: absolute; top: -12px; left: 14px; display: flex; gap: 6px; align-items: center; font: 500 12px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.ptab { background: var(--fg); color: var(--bg); padding: 3px 6px; }
.card { position: absolute; width: 150px; height: 72px; border-radius: 12px; background: rgba(255,255,255,.06); padding: 9px 11px; font-size: 12px; line-height: 1.35; color: var(--fg); }
.card small { display: inline-block; font: 500 9px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 5px; border-radius: 4px; margin-bottom: 5px; color: var(--bg); }
.card[data-sel] { outline: 2px solid var(--accent-cyan); outline-offset: 3px; }
.card[data-new] { outline: 1px dashed var(--accent-cyan); outline-offset: 3px; background: color-mix(in srgb, var(--accent-cyan) 10%, transparent); }

/* Docked columns on the ground. */
.col { position: absolute; top: 0; bottom: 0; background: var(--ground); display: flex; flex-direction: column; overflow: hidden; }
.head { display: flex; align-items: baseline; gap: 10px; padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
.head h2 { margin: 0; font-size: 20px; font-weight: 500; color: var(--fg-strong); }
.head .sub { color: var(--fg-dim); font-size: 12px; }
.head .tools { margin-left: auto; display: flex; gap: 12px; color: var(--fg-dim); font: 12px var(--font-mono); white-space: nowrap; }
.body { flex: 1; overflow: hidden; padding: 14px 18px; }
.rule { display: flex; align-items: center; gap: 8px; font: 500 11px/1 var(--font-mono); letter-spacing: .05em; color: var(--fg); margin: 6px 0 12px; }
.rule::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.row { padding: 8px 0; color: var(--fg); font-size: 13px; }
.row span { color: var(--fg-dim); font-size: 12px; }
.row[data-on] { background: var(--wash-2); border-radius: 10px; padding: 8px 10px; margin: 0 -10px; }

/* The agent's conversation. */
.msg { margin: 0 0 14px; font-size: 13px; line-height: 1.55; }
.msg.me { margin-left: 30%; padding: 9px 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent-magenta) 16%, transparent); }
.msg.it { color: var(--fg); }
.steps { font: 12px/1.7 var(--font-mono); color: var(--fg-dim); margin-bottom: 12px; }
.steps b { color: var(--accent-cyan); font-weight: 400; }
.change { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
.change .ln { font: 12px/1.8 var(--font-mono); color: var(--fg-muted); }
.change .ln b { color: var(--accent-cyan); font-weight: 400; }
.change .go { display: flex; gap: 8px; margin-top: 8px; }
.pill { padding: 4px 11px; border-radius: 999px; font: 12px var(--font-mono); color: var(--fg-dim); border: 1px solid transparent; }
.pill.main { background: var(--accent-cyan); color: var(--bg); }
.prompt { margin: 0 14px 14px; padding: 11px 14px; border-radius: 16px; background: rgba(255,255,255,.06); color: var(--fg-dim); font: 13px var(--font-mono); display: flex; justify-content: space-between; }
.prompt i { font-style: normal; color: var(--accent-cyan); }

/* The orb. */
.orb { position: absolute; right: 26px; bottom: 22px; width: 72px; height: 72px; border-radius: 50%; z-index: 9;
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.35), rgba(255,255,255,.08) 55%, transparent 70%);
  display: grid; place-items: center; font: 9px/1 var(--font-mono); color: var(--fg-dim); }
.orb::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background-image: radial-gradient(var(--fg) .9px, transparent 1.2px); background-size: 5px 5px; opacity: .5; -webkit-mask: radial-gradient(circle, #000 60%, transparent 72%); mask: radial-gradient(circle, #000 60%, transparent 72%); }
.orb::after { content: '▮ ▮'; position: relative; color: var(--fg-strong); font-size: 14px; letter-spacing: 2px; }
.orb[data-small] { width: 44px; height: 44px; }
.orb[data-small]::after { font-size: 9px; }

/* The small box (today's opened orb). */
.box { position: absolute; right: 16px; bottom: 16px; width: 380px; padding: 52px 14px 12px; border-radius: 20px; background: var(--ground); outline: 1px solid var(--line-hover); z-index: 8; }
.box .asks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.box .asks div { font-size: 13px; color: var(--fg-muted); }
.box .prompt { margin: 0; }

/* Option D: the island. */
.island { position: absolute; right: 18px; bottom: 104px; top: 70px; width: 400px; border-radius: 24px; z-index: 8;
  background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(14px); outline: 1px solid var(--line-hover); display: flex; flex-direction: column; overflow: hidden; }

.note { position: absolute; z-index: 12; font: 11px/1.4 var(--font-mono); color: var(--accent-yellow); background: rgba(0,0,0,.75); padding: 6px 9px; border-radius: 8px; border: 1px dashed var(--accent-yellow); max-width: 240px; }
</style>
</head>
<body>
<div class="top">
  <h1>The agent's place</h1>
  <div class="grp" id="opts"><span>option</span></div>
  <div class="grp" id="states"><span>state</span></div>
</div>
<aside class="about" id="about"></aside>
<div class="stageWrap"><div class="stage" id="stage"></div></div>

<script>
// ── Parts ───────────────────────────────────────────────────────────────────────────────────────────────
const W = 1280, H = 760, GAP = 8, RAIL = 60, COL = 400, CARDP = 360, PLACE = 400

const rail = (on, ai) => `<div class="rail"><div class="mid"><span>+</span><span>⛶</span><span>◎</span><span>?</span></div>
  <div class="foot"><div class="ic" ${on === 'talk' ? 'data-on' : ''}>▭</div><div class="ic" ${on === 'tasks' ? 'data-on' : ''}>▥</div><div class="ic" ${on === 'docs' ? 'data-on' : ''}>▤</div>${ai ? `<div class="ic ai" ${on === 'agent' ? 'data-on' : ''}>✳</div>` : ''}<div class="me">A</div><div class="ic">⚙</div></div></div>`

const canvas = ({ fresh = false, sel = false } = {}) => `<div class="dots"></div>
  <div class="piece" style="left:150px;top:120px;width:620px;height:430px">
    <div class="pname"><span class="ptab">▦ PLANE</span>01 PAZAR</div>
    <div class="card" style="left:30px;top:40px"><small style="background:var(--accent-green)">customer</small><br>Office workers</div>
    <div class="card" ${sel ? 'data-sel' : ''} style="left:230px;top:40px"><small style="background:var(--accent-magenta)">problem</small><br>Lunch is dear</div>
    <div class="card" style="left:430px;top:40px"><small style="background:var(--fg)">idea</small><br>Shared lunch boxes</div>
    <div class="card" style="left:30px;top:170px"><small style="background:var(--accent-yellow)">competitor</small><br>Yemeksepeti</div>
    ${fresh ? `<div class="card" data-new style="left:230px;top:170px"><small style="background:var(--accent-magenta)">problem</small><br>No time to cook</div>
    <div class="card" data-new style="left:430px;top:170px"><small style="background:var(--accent-magenta)">problem</small><br>Office kitchens are small</div>
    <div class="card" data-new style="left:230px;top:300px"><small style="background:var(--fg)">idea</small><br>A weekly menu by the team</div>` : ''}
  </div>
  <div class="piece" style="left:840px;top:160px;width:340px;height:260px">
    <div class="pname"><span class="ptab">☐ DECK</span>02 LAUNCH</div>
  </div>`

const page = (inner) => `<div class="page">${inner}</div>`
const sheet = (l, r, inner, crumb = 'Pazar') => {
  const lifted = l > 0 || r > 0
  return `<div class="sheet" ${lifted ? 'data-lifted' : ''} style="left:${l}px;right:${r}px">${inner}
    <div class="crumb"><i>#</i> north-star &nbsp;/&nbsp; workspaces &nbsp;/&nbsp; <b>${crumb}</b></div></div>`
}

const conversation = (n = 1) => `
  <div class="msg me">Find three more problems office workers have with lunch, and add them to 01 Pazar.</div>
  <div class="steps"><b>✓</b> read 01 Pazar · 4 cards<br><b>✓</b> searched the web: "office lunch problems"<br><b>✓</b> looked at the plane</div>
  <div class="msg it">Three that come up most, each with where it was said. They go under <b>Lunch is dear</b>, linked to Office workers.</div>
  <div class="change"><div class="ln"><b>+</b> No time to cook · problem</div><div class="ln"><b>+</b> Office kitchens are small · problem</div><div class="ln"><b>+</b> A weekly menu by the team · idea</div>
    <div class="go"><span class="pill main">add these 3</span><span class="pill">change…</span><span class="pill">drop</span></div></div>
  ${n > 1 ? '<div class="msg me">And a deck to test the first one?</div>' : ''}`

const agentHead = (tools) => `<div class="head"><h2>Agent</h2><span class="sub">gpt-5 · this chat</span><div class="tools">${tools}</div></div>`
const agentColumn = (left, width, tools = 'chats &nbsp; notes &nbsp; ✕') => `<div class="col" style="left:${left}px;width:${width}px">
  ${agentHead(tools)}<div class="body">${conversation()}</div><div class="prompt"><span>&gt; ask more…</span><i>↵</i></div></div>`

const cardPanel = (left) => `<div class="col" style="left:${left}px;width:${CARDP}px">
  <div class="head"><h2>Lunch is dear</h2><span class="sub">problem</span><div class="tools">✕</div></div>
  <div class="body"><div class="rule">01 WHAT IT IS</div><div class="row">testing <span>+2 −1</span></div>
  <div class="rule">02 WHAT BACKS IT</div><div class="row">“I spend 15 € a day” <span>interview · 3 Nov</span></div><div class="row">Menu prices up 20 % <span>source · web</span></div>
  <div class="rule">03 LINKS</div><div class="row">for Office workers</div></div></div>`

const talkColumn = () => `<div class="col" style="left:${RAIL}px;width:${PLACE}px">
  <div class="head"><h2>Talk</h2><span class="sub">everywhere</span><div class="tools">full &nbsp; ✕</div></div>
  <div class="body"><div class="rule">CHANNELS</div><div class="row"># general <span>&nbsp;now</span></div><div class="row"># launch-week</div>
  <div class="rule">01 PAZAR</div><div class="row">Lunch is dear <span>&nbsp;Bob: is 15 € right?</span></div></div></div>`

const chatsList = (left, width, on = 0) => `<div class="col" style="left:${left}px;width:${width}px">
  <div class="head"><h2>${width > 300 ? 'Agent' : 'Chats'}</h2><div class="tools">${width > 300 ? 'full &nbsp; ✕' : '+ new'}</div></div>
  <div class="body"><div class="rule">TODAY</div><div class="row" ${on === 0 ? 'data-on' : ''}>Office lunch problems <span><br>3 cards waiting</span></div><div class="row">Competitor prices</div>
  <div class="rule">EARLIER</div><div class="row">Research: lunch boxes <span><br>a document</span></div><div class="row">Organise 01 Pazar</div><div class="row">Shared · Bob: pricing</div></div></div>`

const box = () => `<div class="box"><div class="asks"><div>› what's weakest on 01 Pazar?</div><div>› find competitors for Shared lunch boxes</div><div>› /research office lunch in Berlin</div></div><div class="prompt"><span>&gt; ask about Pazar…</span><i>↵</i></div></div>`
const orb = (small) => `<div class="orb" ${small ? 'data-small' : ''}></div>`
const note = (x, y, t) => `<div class="note" style="left:${x}px;top:${y}px">${t}</div>`

// ── Options ─────────────────────────────────────────────────────────────────────────────────────────────
const OPTS = {
  A: {
    name: 'today',
    title: 'A · Today: the corner grows into the far right',
    about: `<p>What the app does now. The orb opens a small box; the first message grows it into a column at the far right, and the screen narrows for it. A card's panel docks left of it.</p>
      <h2>Good</h2><ul class="plus"><li><b>You see the canvas</b> while it works, and its previews on the real pieces.</li><li><b>Nothing new to learn.</b></li></ul>
      <h2>Not so good</h2><ul class="minus"><li><b>Three columns</b> with Talk and a card open: the canvas gets thin.</li><li><b>No room for a long job</b> (research, a plan with many steps): the column is the most it gets.</li><li>Chats are a list inside the column, not a place.</li></ul>`,
    states: {
      closed: () => rail() + sheet(0, 0, canvas()) + orb(),
      'box open': () => rail() + sheet(0, 0, canvas()) + box() + orb(),
      chatting: () => rail() + sheet(RAIL, COL + GAP, canvas({ fresh: true })) + agentColumn(W - COL, COL),
      '+ a card panel': () => rail() + sheet(RAIL, COL + CARDP + GAP, canvas({ fresh: true, sel: true })) + cardPanel(W - COL - CARDP) + agentColumn(W - COL, COL),
      '+ Talk beside': () => rail('talk') + talkColumn() + sheet(RAIL + PLACE + GAP, COL + CARDP + GAP, canvas({ fresh: true, sel: true })) + cardPanel(W - COL - CARDP) + agentColumn(W - COL, COL) + note(470, 690, 'the canvas: 420 px left'),
    },
  },
  B: {
    name: 'a fourth place',
    title: 'B · The agent as a place, beside Talk, Tasks, Docs',
    about: `<p>The agent joins the places at the HUD's foot (✳). It opens <b>on the left</b> like them, and <b>full</b> makes it the page: your chats on the left, the conversation on the rest. The orb stays in the corner and opens it too.</p>
      <h2>Good</h2><ul class="plus"><li><b>One rule for everything:</b> places left, the thing selected right.</li><li><b>Chats are a place:</b> find, reopen, share, like Talk's threads.</li><li>The right stays free for the card it's changing.</li></ul>
      <h2>Not so good</h2><ul class="minus"><li><b>One place at a time:</b> you can't ask the agent while Talk or Tasks is open.</li><li>On the left it sits <b>far from the orb</b>, which still lives bottom right.</li></ul>`,
    states: {
      closed: () => rail(null, true) + sheet(0, 0, canvas()) + orb(),
      'beside the canvas': () => rail('agent', true) + agentColumn(RAIL, COL, 'full &nbsp; chats &nbsp; ✕') + sheet(RAIL + COL + GAP, 0, canvas({ fresh: true })) + orb(true),
      '+ a card panel': () => rail('agent', true) + agentColumn(RAIL, COL, 'full &nbsp; chats &nbsp; ✕') + sheet(RAIL + COL + GAP, CARDP + GAP, canvas({ fresh: true, sel: true })) + cardPanel(W - CARDP) + orb(true),
      'as the page': () => rail('agent', true) + sheet(RAIL, 0, page(chatsList(0, 280) + `<div class="col" style="left:280px;right:0;background:var(--bg)">${agentHead('beside the canvas &nbsp; ✕')}<div class="body" style="max-width:720px">${conversation(2)}</div><div class="prompt" style="max-width:720px"><span>&gt; ask more…</span><i>↵</i></div></div>`), 'Pazar / Agent') + orb(true),
    },
  },
  C: {
    name: 'the column, with full',
    rec: true,
    title: 'C · The far right as now, and a page when it needs one',
    about: `<p>Today's orb, box and column at the far right stay. The column gets what the places have: <b>full</b> makes the agent <b>the page</b>, in the canvas's place: your chats on the left, the conversation in the middle, <b>what it would change</b> drawn on the right, on the real pieces.</p>
      <h2>Good</h2><ul class="plus"><li><b>Small asks stay small</b>, beside the canvas, as now.</li><li><b>Big jobs get room:</b> research, a plan of many steps, a long document.</li><li>The agent <b>works alongside Talk or Tasks</b>: it's not one of them.</li><li>Chats as a list you can see, as Talk's threads.</li></ul>
      <h2>Not so good</h2><ul class="minus"><li>Two ways to see it (column, page) to learn.</li><li>As the page you don't see the canvas whole; its changes show on a picture of it.</li></ul>`,
    states: {
      closed: () => rail() + sheet(0, 0, canvas()) + orb(),
      'box open': () => rail() + sheet(0, 0, canvas()) + box() + orb(),
      column: () => rail() + sheet(RAIL, COL + GAP, canvas({ fresh: true })) + agentColumn(W - COL, COL, 'full &nbsp; chats &nbsp; ✕'),
      '+ Talk beside': () => rail('talk') + talkColumn() + sheet(RAIL + PLACE + GAP, COL + GAP, canvas({ fresh: true })) + agentColumn(W - COL, COL, 'full &nbsp; chats &nbsp; ✕'),
      'as the page': () => rail() + sheet(RAIL, 0, page(
        chatsList(0, 260) +
        `<div class="col" style="left:260px;width:520px;background:var(--bg);border-left:1px solid var(--line)">${agentHead('')}<div class="body">${conversation(2)}</div><div class="prompt"><span>&gt; ask more…</span><i>↵</i></div></div>` +
        `<div class="col" style="left:780px;right:0;background:var(--bg);border-left:1px solid var(--line)"><div class="head"><h2>What it changes</h2><span class="sub">01 Pazar</span><div class="tools">beside the canvas &nbsp; ✕</div></div>
          <div style="position:relative;flex:1;transform:scale(.48) translate(-100px, 40px);transform-origin:0 0;width:210%">${canvas({ fresh: true })}</div></div>`), 'Pazar / Agent'),
    },
  },
  D: {
    name: 'an island',
    title: 'D · Bold: a glass island over the canvas',
    about: `<p>The chat never docks: a tall <b>glass island</b> rises from the orb and floats over the canvas, which stays whole and never narrows. Its previews light the real pieces behind it, seen through the glass. <b>pin</b> docks it as today's column.</p>
      <h2>Good</h2><ul class="plus"><li><b>The canvas never moves</b>; the agent feels like a companion, not a panel.</li><li>The orb and the chat are one thing, in one corner.</li></ul>
      <h2>Not so good</h2><ul class="minus"><li><b>It covers</b> the right of the canvas while open.</li><li>A new kind of surface (glass, floating) the app doesn't have elsewhere: D-387 put every column on the ground.</li><li>With a card panel open, it floats over it.</li></ul>`,
    states: {
      closed: () => rail() + sheet(0, 0, canvas()) + orb(),
      'island open': () => rail() + sheet(0, 0, canvas({ fresh: true })) + `<div class="island">${agentHead('pin &nbsp; chats &nbsp; ✕')}<div class="body">${conversation()}</div><div class="prompt"><span>&gt; ask more…</span><i>↵</i></div></div>` + orb(),
      '+ a card panel': () => rail() + sheet(RAIL, CARDP + GAP, canvas({ fresh: true, sel: true })) + cardPanel(W - CARDP) + `<div class="island" style="right:${CARDP + 18}px">${agentHead('pin &nbsp; chats &nbsp; ✕')}<div class="body">${conversation()}</div><div class="prompt"><span>&gt; ask more…</span><i>↵</i></div></div>` + orb(),
      pinned: () => rail() + sheet(RAIL, COL + GAP, canvas({ fresh: true })) + agentColumn(W - COL, COL, 'unpin &nbsp; chats &nbsp; ✕'),
    },
  },
}

// ── Wiring ──────────────────────────────────────────────────────────────────────────────────────────────
const q = new URLSearchParams(location.hash.slice(1))
let opt = OPTS[q.get('o')] ? q.get('o') : 'C'
let state = q.get('s') ?? null
const $ = (id) => document.getElementById(id)
function draw() {
  const o = OPTS[opt]
  if (!o.states[state]) state = Object.keys(o.states)[0]
  location.replace('#' + new URLSearchParams({ o: opt, s: state }))
  $('opts').innerHTML = '<span>option</span>' + Object.entries(OPTS).map(([k, v]) => `<button class="opt" data-o="${k}" aria-pressed="${k === opt}"><b>${k}</b>${v.name}${v.rec ? '<span class="rec">· recommended</span>' : ''}</button>`).join('')
  $('states').innerHTML = '<span>state</span>' + Object.keys(o.states).map((s) => `<button class="opt" data-s="${s}" aria-pressed="${s === state}">${s}</button>`).join('')
  $('about').innerHTML = `<h3>${o.title}</h3>${o.about}<div class="now">Showing: <b>${state}</b>. Pick another state above; every option keeps the orb in the bottom-right corner while closed (D-408).</div>`
  $('stage').innerHTML = o.states[state]()
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.o) { opt = b.dataset.o; state = null }
  if (b.dataset.s) state = b.dataset.s
  draw()
})
function fit() { const w = $('stage').parentElement; const k = Math.min((w.clientWidth - 32) / W, (w.clientHeight - 32) / H); $('stage').style.transform = `scale(${k})` }
addEventListener('resize', fit)
draw(); fit()
</script>
</body>
</html>
