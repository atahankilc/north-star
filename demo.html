<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>North Star · demo</title>
    <script>
      // The onboarding's demo realm (D-315): set before any module loads, so src/data/firebase.ts never starts Firebase.
      window.__northStarDemo = true
      // The stored theme before the first paint, as index.html does (D-069); src/state/theme.ts takes over from here.
      try {
        var t = localStorage.getItem('north-star.theme')
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (t === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
