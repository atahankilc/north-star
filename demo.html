<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>North Star · demo</title>
    <script>
      // The onboarding's demo realm (D-315): set before any module loads, so src/data/firebase.ts never starts Firebase.
      window.__northStarDemo = true
      // The stored theme before the first paint, as index.html does (D-069); src/state/theme.ts takes over from here.
      try {
        var t = localStorage.getItem('north-star.theme')
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (t === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
    <script>
      // The demo's own storage (D-315): localStorage and sessionStorage in memory, so nothing a real component keeps (the
      // split, the guides, a deck's lanes…) reaches the app's storage on this origin. Seeded with copies of the app's
      // theme and motion choices, which the demo follows. Here, as a plain script, so it's in place before any module.
      ;(function () {
        function Memory() {
          this._m = new Map()
        }
        Memory.prototype = {
          get length() {
            return this._m.size
          },
          clear: function () {
            this._m.clear()
          },
          getItem: function (k) {
            k = String(k)
            return this._m.has(k) ? this._m.get(k) : null
          },
          key: function (i) {
            return Array.from(this._m.keys())[i] ?? null
          },
          removeItem: function (k) {
            this._m.delete(String(k))
          },
          setItem: function (k, v) {
            this._m.set(String(k), String(v))
          },
        }
        var local = new Memory()
        ;['north-star.theme', 'north-star.motion'].forEach(function (k) {
          try {
            var v = window.localStorage.getItem(k)
            if (v !== null) local.setItem(k, v)
          } catch (e) {}
        })
        Object.defineProperty(window, 'localStorage', { value: local, configurable: true })
        Object.defineProperty(window, 'sessionStorage', { value: new Memory(), configurable: true })
      })()

      // The demo's own time (D-315, onboarding.md §6.2 "Clock"), in place before any module reads the time or asks for a
      // frame: performance.now, requestAnimationFrame and the timers run on a virtual clock that moves only when the
      // director steps it (src/demo/director.ts; with the browser's frames while playing, in fixed steps while seeking);
      // Date reads a fixed day plus the scene's time; Math.random is seeded again as each scene starts. src/demo/clock.ts
      // is its typed face.
      ;(function () {
        var real = {
          now: performance.now.bind(performance),
          raf: window.requestAnimationFrame.bind(window),
          caf: window.cancelAnimationFrame.bind(window),
          setTimeout: window.setTimeout.bind(window),
          Date: window.Date,
        }
        // Tuesday 20 October 2026, 10:30 in Berlin: the Pazar fixture's day.
        var DAY = Date.UTC(2026, 9, 20, 8, 30)
        var abs = real.now()
        var zero = abs
        var timers = new Map()
        var rafs = new Map()
        var nextId = 1
        // A timer set during a step waits for the next one at least, so one that sets itself again can't hold a step.
        var steps = 0
        performance.now = function () {
          return abs
        }
        window.requestAnimationFrame = function (cb) {
          var id = nextId++
          rafs.set(id, cb)
          return id
        }
        window.cancelAnimationFrame = function (id) {
          rafs.delete(id)
        }
        function add(fn, ms, args, every) {
          var id = nextId++
          if (typeof fn !== 'function') return id
          var wait = Math.max(0, Number(ms) || 0)
          timers.set(id, { id: id, at: abs + wait, fn: fn, args: args, every: every ? Math.max(1, wait) : null, made: steps })
          return id
        }
        window.setTimeout = function (fn, ms) {
          return add(fn, ms, Array.prototype.slice.call(arguments, 2), false)
        }
        window.setInterval = function (fn, ms) {
          return add(fn, ms, Array.prototype.slice.call(arguments, 2), true)
        }
        window.clearTimeout = window.clearInterval = function (id) {
          timers.delete(Number(id))
        }
        function sceneNow() {
          return DAY + Math.round(abs - zero)
        }
        var RealDate = real.Date
        function DemoDate() {
          if (!new.target) return new RealDate(sceneNow()).toString()
          return arguments.length ? new (Function.prototype.bind.apply(RealDate, [null].concat(Array.prototype.slice.call(arguments))))() : new RealDate(sceneNow())
        }
        DemoDate.prototype = RealDate.prototype
        DemoDate.now = sceneNow
        DemoDate.UTC = RealDate.UTC
        DemoDate.parse = RealDate.parse
        window.Date = DemoDate
        // mulberry32, seeded again as each scene starts.
        var seed = 1
        Math.random = function () {
          seed = (seed + 0x6d2b79f5) | 0
          var t = seed
          t = Math.imul(t ^ (t >>> 15), t | 1)
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
        function step(dt) {
          var until = abs + Math.max(0, dt)
          var now = ++steps
          for (;;) {
            var next = null
            timers.forEach(function (t) {
              if (t.at <= until && t.made < now && (!next || t.at < next.at || (t.at === next.at && t.id < next.id))) next = t
            })
            if (!next) break
            abs = Math.max(abs, next.at)
            if (next.every !== null) {
              next.at += next.every
              next.made = now
            } else timers.delete(next.id)
            try {
              next.fn.apply(window, next.args)
            } catch (e) {
              reportError(e)
            }
          }
          abs = until
          var due = rafs
          rafs = new Map()
          due.forEach(function (cb) {
            try {
              cb(abs)
            } catch (e) {
              reportError(e)
            }
          })
        }
        window.__demoClock = {
          real: real,
          day: DAY,
          step: step,
          restart: function () {
            zero = abs
            seed = 1
          },
          sceneTime: function () {
            return abs - zero
          },
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
