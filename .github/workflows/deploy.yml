name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Checks before the build; any of them failing stops the deploy. Lint only counts hook warnings (D-320).
      - run: npm test
      - run: npm run check:lessons
      - run: npm run check:gallery
      - run: npm run check:tokens
      - run: npm run check:kit
      # An exported name declared twice (D-391); the slow parts are the `repeats` job's.
      - run: npm run check:repeats -- --names
      - run: npm run lint
      - run: npm ci --prefix functions
      - run: npm run build:functions
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Set these under Settings → Secrets and variables → Actions → Variables
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The gallery's examples that act, run in headless Chrome (check:gallery:live, D-324): a step that finds nothing fails
  # it. Its own job, so it shows red without holding the deploy (a headless run can stall now and then).
  gallery-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:gallery:live

  # Every lesson's scene played to its end in headless Chrome (check:scenes, D-401): a step that finds nothing fails it.
  # Its own job, as the gallery's: red without holding the deploy.
  scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:scenes

  # Copied blocks and unused files or exports (check:repeats, D-391: jscpd and knip, installed in the job's own cache).
  # Its own job, as gallery-live: it shows red without holding the deploy.
  repeats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:repeats

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
